<nav [class.scrolled]="isScrolled()" [class.menu-open]="menuOpen()">
  <div class="nav-container">
    <a class="logo" (click)="scrollTo('#hero')">JCO<span class="accent">.</span></a>

    <div class="nav-right">
      <button class="lang-toggle" (click)="i18n.toggleLang()" [attr.aria-label]="'Switch language'">
        {{ i18n.lang() === 'es' ? 'EN' : 'ES' }}
      </button>

      <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <ul class="nav-links" [class.active]="menuOpen()">
      <li><a (click)="scrollTo('#about')">{{ i18n.t().nav.about }}</a></li>
      <li><a (click)="scrollTo('#projects')">{{ i18n.t().nav.projects }}</a></li>
      <li><a (click)="scrollTo('#contact')">{{ i18n.t().nav.contact }}</a></li>
    </ul>
  </div>
</nav>
