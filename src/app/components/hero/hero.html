<section class="hero" id="hero">
  <!-- Atmospheric Background Layers -->
  <div class="hero-atmosphere">
    <div class="ambient-glow"></div>
    <div class="fog-layer fog-1"></div>
    <div class="fog-layer fog-2"></div>
    <div class="organic-orb orb-1"></div>
    <div class="organic-orb orb-2"></div>

    <!-- Decorative Lines -->
    <svg class="decorative-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="0" y1="50" x2="30" y2="50" class="line-h" />
      <line x1="70" y1="50" x2="100" y2="50" class="line-h" />
      <line x1="50" y1="0" x2="50" y2="20" class="line-v" />
      <line x1="50" y1="80" x2="50" y2="100" class="line-v" />
    </svg>
  </div>

  <!-- Corner Decorations -->
  <div class="corner-accent top-left"></div>
  <div class="corner-accent top-right"></div>
  <div class="corner-accent bottom-left"></div>
  <div class="corner-accent bottom-right"></div>

  <div class="hero-content">
    <p class="hero-greeting">{{ i18n.t().hero.greeting }}</p>

    <h1 class="hero-name">
      <span class="name-main">Jordi Comes</span>
    </h1>

    <div class="hero-divider">
      <span class="divider-line"></span>
      <span class="divider-glyph">&#10022;</span>
      <span class="divider-line"></span>
    </div>

    <h2 class="hero-role">{{ i18n.t().hero.role }}</h2>

    <p class="hero-tagline">{{ i18n.t().hero.tagline }}</p>

    <button class="hero-cta" (click)="scrollTo('#projects')">
      <span class="cta-text">{{ i18n.t().hero.cta }}</span>
      <span class="cta-line"></span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

  <div class="scroll-indicator">
    <!-- Mouse icon for desktop -->
    <svg class="indicator-icon icon-mouse" xmlns="http://www.w3.org/2000/svg" width="24" height="38" viewBox="0 0 24 38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="34" rx="10" ry="10"></rect>
      <!-- Scroll wheel animation inside mouse -->
      <line x1="12" y1="9" x2="12" y2="15" class="mouse-wheel"></line>
    </svg>
    <!-- Touch indicator for mobile/tablet - minimal ornament -->
    <div class="indicator-icon icon-touch">
      <div class="touch-glyph">&#10022;</div>
      <div class="touch-pulse"></div>
    </div>
  </div>
</section>
