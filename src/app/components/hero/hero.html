<section class="hero" id="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-greeting">{{ i18n.t().hero.greeting }}</p>
    <h1 class="hero-name">Jordi Comes<span class="accent"> Orrit</span></h1>
    <h2 class="hero-role">{{ i18n.t().hero.role }}</h2>
    <p class="hero-tagline">{{ i18n.t().hero.tagline }}</p>
    <button class="hero-cta" (click)="scrollTo('#projects')">
      {{ i18n.t().hero.cta }}
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>
  <div class="scroll-indicator">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
  </div>
</section>
