<section class="projects section" id="projects">
  <div class="container">
    <h2 class="section-title" appScrollAnimation direction="bottom">{{ i18n.t().projects.title }}</h2>
    <p class="section-subtitle" appScrollAnimation direction="bottom" [delay]="100">
      {{ i18n.t().projects.subtitle }}
    </p>

    <div class="projects-grid">
      @for (project of i18n.t().projects.items; track project.title; let i = $index) {
        <article class="project-card" appScrollAnimation [direction]="i % 2 === 0 ? 'left' : 'right'" [delay]="i * 100">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h3 class="card-title">{{ project.title }}</h3>
          <p class="card-description">{{ project.description }}</p>
          <div class="card-tags">
            @for (tag of project.tags; track tag) {
              <span class="tag">{{ tag }}</span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
